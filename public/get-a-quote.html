<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | TOP CAPITAL LLC</title>
    <meta name="description" content="TOP CAPITAL LLC — residential and commercial renovation.">
    <link rel="icon" href="images/favicon.png" type="image/png">

    <link href="css/bootstrap.min.css" rel="stylesheet" id="bootstrap">
    <link href="css/plugins.css" rel="stylesheet">
    <link href="css/swiper.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/coloring.css" rel="stylesheet">
    <link href="css/colors/scheme-01.css" rel="stylesheet" id="colors">
</head>

<body>

    <div data-include="header"></div>

    <main>

        <a href="#" id="back-to-top"></a>
        
        <!-- page preloader begin -->
        <div id="de-loader"></div>
        <!-- page preloader close -->

        <section class="jarallax relative overflow-hidden z-1000 mt-80">
            <img src="images/background/3.webp" class="jarallax-img" alt="">
            <div class="sw-overlay op-2"></div>
            <div class="gradient-edge-start light w-40 start-40 op-9 z-2"></div>
            <div class="abs w-40 h-100 bg-white top-0 start-0 op-9 z-2"></div>
            <div class="container relative z-2">
                <div class="row wow fadeInRight">
                    <div class="col-lg-10">
                        <h1 class="fs-sm-10vw mb-0">
                            Get a Quote
                        </h1>

                        <ul class="crumb">
                            <li><a href="index.html">Home</a></li>
                            <li class="active">Get a Quote</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="container">
                <div class="row g-4 justify-content-center">
                    <div class="col-lg-8">
                        <div id="form-wrapper">
                            <form name="estimator-form" id="estimator-form" class="position-relative z1000" novalidate>
                                <input type="text" name="website" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true">

                                <div class="row g-4">

                                    <!-- Personal Details -->
                                    <div class="col-12">
                                        <h4>Personal Details</h4>
                                    </div>

                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Your Name *</label>
                                            <input type="text" name="name" class="form-control" placeholder="Write your name">
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Email *</label>
                                            <input type="email" name="email" class="form-control" placeholder="Email address">
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Phone *</label>
                                            <input type="text" name="phone" class="form-control" placeholder="Phone number">
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Company Name (Optional)</label>
                                            <input type="text" name="company" class="form-control" placeholder="Company name">
                                        </div>
                                    </div>

                                    <!-- Project Description -->
                                    <div class="col-12 pt-4">
                                        <h4>Tell Us More About Your Project</h4>
                                    </div>

                                    <div class="col-md-12">
                                        <div class="field-set">
                                            <label>Project Description *</label>
                                            <textarea name="project_description" class="form-control" rows="6" placeholder="Describe your renovation project..."></textarea>
                                        </div>
                                    </div>

                                    <!-- Project Type -->
                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Project Type *</label>
                                            <div class="relative">
                                                <select name="project_type" class="form-control">
                                                    <option value="">Select Project Type</option>
                                                    <option>Residential</option>
                                                    <option>Commercial</option>
                                                    <option>Kitchen Remodeling</option>
                                                    <option>Bathroom Renovation</option>
                                                    <option>Whole Home Renovation</option>
                                                    <option>Interior Remodeling</option>
                                                    <option>Home Addition</option>
                                                    <option>Exterior Renovation</option>
                                                </select>
                                                <i class="absolute top-0 end-0 id-color pt-3 pe-3 icofont-simple-down"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Property Size -->
                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Property Size</label>
                                            <div class="relative">
                                                <select name="property_size" class="form-control">
                                                    <option value="">Select Property Size</option>
                                                    <option>Under 1,000 sq ft</option>
                                                    <option>1,000 - 2,000 sq ft</option>
                                                    <option>2,000 - 3,500 sq ft</option>
                                                    <option>3,500 - 5,000 sq ft</option>
                                                    <option>Over 5,000 sq ft</option>
                                                </select>
                                                <i class="absolute top-0 end-0 id-color pt-3 pe-3 icofont-simple-down"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Budget -->
                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Estimated Budget *</label>
                                            <div class="relative">
                                                <select name="budget" class="form-control">
                                                    <option value="">Select Budget</option>
                                                    <option>Under $50K</option>
                                                    <option>$50K - $100K</option>
                                                    <option>$100K - $250K</option>
                                                    <option>$250K - $500K</option>
                                                    <option>$500K - $1M</option>
                                                    <option>Over $1M</option>
                                                </select>
                                                <i class="absolute top-0 end-0 id-color pt-3 pe-3 icofont-simple-down"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Timeline -->
                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Project Timeline *</label>
                                            <div class="relative">
                                                <select name="timeline" class="form-control">
                                                    <option value="">Select Timeline</option>
                                                    <option>Urgent (Within 1 Month)</option>
                                                    <option>1 - 3 Months</option>
                                                    <option>3 - 6 Months</option>
                                                    <option>6 - 12 Months</option>
                                                    <option>More Than 1 Year</option>
                                                </select>
                                                <i class="absolute top-0 end-0 id-color pt-3 pe-3 icofont-simple-down"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Preferred Style -->
                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Preferred Style</label>
                                            <div class="relative">
                                                <select name="style" class="form-control">
                                                    <option value="">Select Style</option>
                                                    <option>Modern</option>
                                                    <option>Contemporary</option>
                                                    <option>Minimalist</option>
                                                    <option>Scandinavian</option>
                                                    <option>Industrial</option>
                                                    <option>Classic</option>
                                                    <option>Farmhouse</option>
                                                    <option>Luxury</option>
                                                </select>
                                                <i class="absolute top-0 end-0 id-color pt-3 pe-3 icofont-simple-down"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Preferred Start Date -->
                                    <div class="col-md-6">
                                        <div class="field-set">
                                            <label>Preferred Start Date</label>
                                            <input type="date" name="start_date" class="form-control">
                                        </div>
                                    </div>

                                    <!-- Address -->
                                    <div class="col-md-12">
                                        <div class="field-set">
                                            <label>Project Address</label>
                                            <input type="text" name="address" class="form-control" placeholder="Property address">
                                        </div>
                                    </div>

                                    <!-- Special Requirements -->
                                    <div class="col-md-12">
                                        <div class="field-set">
                                            <label>Special Requirements</label>
                                            <textarea name="requirements" class="form-control" rows="5" placeholder="Tell us about your preferred materials, design inspiration, accessibility needs, custom features, or anything else you'd like us to know..."></textarea>
                                        </div>
                                    </div>

                                    <!-- Submit -->
                                    <div class="col-md-12">
                                        <input type="submit" id="send_message" value="Get Free Estimate" class="btn-main">
                                    </div>

                                </div>

                            </form>
                        </div>

                        <div id="quote_success" class="d-none mt-5">

                            <div class="p-5 bg-light rounded-1 shadow-sm">

                                <h3 class="mb-3">
                                    <i class="fa fa-check-circle"></i>
                                    Thank You!
                                </h3>

                                <p>
                                    Your renovation quote request has been successfully submitted.
                                    We will review your project and contact you shortly.
                                </p>

                                <div id="quote_summary"></div>

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <div data-include="footer"></div>

    <script src="js/include.js" data-scripts="js/validation-get-a-quote.js"></script>

</body>

</html>
